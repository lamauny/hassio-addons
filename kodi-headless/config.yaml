name: Kodi Headless
version: "Omega-21.3"
slug: kodi_headless
description: A headless install of kodi with a web interface.
  Commonly used with MySQL Kodi setup to allow library updates via web interface.
  Image from Matt Huisman (matthuisman).
url: https://github.com/matthuisman/docker-kodi-headless
arch:
  - amd64
image: docker.io/matthuisman/kodi-headless
init: false
tmpfs: true
legacy: true
host_network: true
ingress: true
ingress_port: 8080
panel_icon: mdi:kodi
panel_title: Kodi
panel_admin: false
map:
  - type: app_config
    read_only: false
    path: /config/.kodi
  - type: media
backup_exclude:
  - Thumbnails/*
options:
  S6_VERBOSITY: 2
  KODI_DELAY: 0
  MYSQL_HOST: core-mariadb
  MYSQL_USER: kodi
  MYSQL_PASSWORD: kodi
  TZ: Europe/Paris
schema:
  S6_VERBOSITY: int(0,5)
  KODI_DELAY: int
  MYSQL_HOST: str
  MYSQL_USER: str
  MYSQL_PASSWORD: password
  TZ: str
ports:
  8080/tcp: 8080
  9090/tcp: 9090
  9777/udp: 9777
