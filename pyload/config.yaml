name: pyLoad
version: "0.5.0"
slug: pyload-ng
description: Run pyLoad-ng in Home Assistant
url: https://pyload.net/
arch:
  - aarch64
  - amd64
image: lscr.io/linuxserver/pyload-ng
init: false
tmpfs: true
legacy: true
host_network: true
ingress: true
ingress_port: 8000
panel_icon: mdi:download-box
panel_title: pyLoad
panel_admin: false
map:
  - type: app_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
    path: /downloads
ports:
  8000/tcp: 8000
  9666/tcp: 9666
ports_description:
  8000/tcp: pyLoad WebUI
  9666/tcp: Click'n'Load port
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
environment:
  PGID: "0"
  PUID: "0"
