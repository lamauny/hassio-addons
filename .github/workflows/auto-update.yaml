name: Auto Update

on:
  schedule:
    - cron: '0 * * * *' # Vérifie toutes les heures
  workflow_dispatch: # Permet de lancer manuellement

env:
  JD_UPSTREAM_REPO: "jlesage/docker-jdownloader-2"
  MA_UPSTREAM_REPO: "music-assistant/server"
  PYLOAD_UPSTREAM_REPO: "linuxserver/docker-pyload-ng"
  KODI_DOCKERHUB_REPO: "matthuisman/kodi-headless"
  KODI_ALLOW_PRERELEASE: "false" # "true" pour suivre aussi les bêtas/RC (ex. Piers-22.0rc2)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "[JDownloader] Check latest release and update"
        run: |
          # Récupère le tag de la dernière release externe
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.JD_UPSTREAM_REPO }}/releases/latest" | jq -r '.tag_name')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Impossible de récupérer la dernière release de ${{ env.JD_UPSTREAM_REPO }}"
            exit 1
          fi
          echo "Dernière release : $LATEST_TAG"

          # Vérifie si cette version est déjà dans config.yaml
          if grep -q "version: \"$LATEST_TAG\"" jdownloader/config.yaml; then
            echo "Déjà à jour ($LATEST_TAG)"
            exit 0
          fi

          # Met à jour config.yaml
          sed -i "s/^version:.*/version: \"$LATEST_TAG\"/" jdownloader/config.yaml

          # Commit
          git add jdownloader/config.yaml
          git commit -m "Update jdownloader image to $LATEST_TAG"

      - name: "[Music Assistant] Check latest release and update"
        run: |
          # Récupère le tag de la dernière release externe
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.MA_UPSTREAM_REPO }}/releases/latest" | jq -r '.tag_name')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Impossible de récupérer la dernière release de ${{ env.MA_UPSTREAM_REPO }}"
            exit 1
          fi
          echo "Dernière release : $LATEST_TAG"

          # Vérifie si cette version est déjà dans config.yaml
          if grep -q "version: \"$LATEST_TAG\"" music_assistant/config.yaml; then
            echo "Déjà à jour ($LATEST_TAG)"
            exit 0
          fi

          # Met à jour config.yaml
          sed -i "s/^version:.*/version: \"$LATEST_TAG\"/" music_assistant/config.yaml

          # Commit
          git add music_assistant/config.yaml
          git commit -m "Update music-assistant image to $LATEST_TAG"

      - name: "[Kodi] Check latest release and update"
        run: |
          # Récupère le tag de la dernière release externe
          # Tags Docker Hub du type "Omega-21.3" ou "Piers-22.0rc2".
          # On ignore les tags d'architecture (-amd64, -arm64...) et les tags
          # "flottants" sans numéro (Omega, Piers, latest...).
          if [ "${{ env.KODI_ALLOW_PRERELEASE }}" = "true" ]; then
            TAG_REGEX='^[A-Za-z]+-[0-9]+(\.[0-9]+)+((a|b|rc)[0-9]+)?$'
          else
            TAG_REGEX='^[A-Za-z]+-[0-9]+(\.[0-9]+)+$'
          fi

          LATEST_TAG=$(curl -fsSL \
            "https://hub.docker.com/v2/repositories/${{ env.KODI_DOCKERHUB_REPO }}/tags?page_size=100&ordering=last_updated" \
            | jq -r --arg re "$TAG_REGEX" '
                .results
                | map(select(.name | test($re)))
                | sort_by(.last_updated)
                | last
                | .name // empty')

          if [ -z "$LATEST_TAG" ] ; then
            echo "::error::Impossible de récupérer la dernière release de ${{ env.KODI_DOCKERHUB_REPO }}"
            exit 1
          fi
          echo "Dernière release : $LATEST_TAG"

          # Vérifie si cette version est déjà dans config.yaml
          if grep -q "version: \"$LATEST_TAG\"" kodi-headless/config.yaml; then
            echo "Déjà à jour ($LATEST_TAG)"
            exit 0
          fi

          # Met à jour config.yaml
          sed -i "s/^version:.*/version: \"$LATEST_TAG\"/" kodi-headless/config.yaml

          # Commit
          git add kodi-headless/config.yaml
          git commit -m "Update kodi-headless image to $LATEST_TAG"

      - name: "[pyLoad] Check latest release and update"
        run: |
          # /releases/latest ignore les pré-releases (builds "develop-xxxx-lsNN")
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.PYLOAD_UPSTREAM_REPO }}/releases/latest" | jq -r '.tag_name')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::Impossible de récupérer la dernière release de ${{ env.PYLOAD_UPSTREAM_REPO }}"
            exit 1
          fi
          echo "Dernière release : $LATEST_TAG"

          if grep -q "version: \"$LATEST_TAG\"" pyload/config.yaml; then
            echo "Déjà à jour ($LATEST_TAG)"
            exit 0
          fi

          sed -i "s/^version:.*/version: \"$LATEST_TAG\"/" pyload/config.yaml

          git add pyload/config.yaml
          git commit -m "Update pyload image to $LATEST_TAG"

      - name: "Push commits, if any"
        run: |
          # Push
          git push
