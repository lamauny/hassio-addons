---
name: JDownloader
version: "v26.09.1"
slug: jdownloader
description: Run JDownloader in Home Assistant.
  Image from Jocelyn Le Sage (jlesage).
url: https://github.com/lamauny/hassio-addons
arch:
  - amd64
  - aarch64
image: ghcr.io/jlesage/jdownloader-2
init: false
tmpfs: true
legacy: true
host_network: true
ingress: true
ingress_port: 5800
panel_icon: mdi:download-box
panel_title: JDownloader
panel_admin: false
map:
  - type: app_config
    read_only: false
  - type: media
    read_only: false
  - type: share
    read_only: false
    path: /output
backup_exclude:
  - "*.jar"
  - logs/*
  - libs/*
  - jd/*
  - tmp/*
  - translations/*
  - update/*
  - xdg/*
options:
  MYJDOWNLOADER_DEVICE_NAME: "JDownloader2 - Home Assistant"
  MYJDOWNLOADER_EMAIL: "user@email.com"
  MYJDOWNLOADER_PASSWORD: "password"
  DISPLAY_WIDTH: 1920
  DISPLAY_HEIGHT: 1080
  DARK_MODE: false
  WEB_AUTHENTICATION: false
  WEB_AUTHENTICATION_DEFAULT_USERNAME: ""
  WEB_AUTHENTICATION_DEFAULT_PASSWORD: ""
schema:
  MYJDOWNLOADER_DEVICE_NAME: str?
  MYJDOWNLOADER_EMAIL: str?
  MYJDOWNLOADER_PASSWORD: password?
  DISPLAY_WIDTH: int?
  DISPLAY_HEIGHT: int?
  DARK_MODE: bool?
  WEB_AUTHENTICATION: bool?
  WEB_AUTHENTICATION_DEFAULT_USERNAME: str?
  WEB_AUTHENTICATION_DEFAULT_PASSWORD: password?
environment:
  JDOWNLOADER_HEADLESS: "0"
  JDOWNLOADER_MAX_MEM: "256m"
  WEB_FILE_MANAGER: "1"
  USER_ID: "0"
  GROUP_ID: "0"
  VNC_LOCALHOST_ONLY: "1"
ports:
  3129/tcp: 3129
  5800/tcp: 5800
ports_description:
  3129/tcp: MyJDownloader communication interface
  5800/tcp: Web interface

